    info1:'Этот сайт НЕ хранит ваши расходы на сервере. Все данные остаются только на вашем телефоне / браузере в localStorage.',

    info3:'Хотите перенести на другой телефон? Используйте кнопки «Сохранить копию» и «Восстановить из файла». Если очистите кеш браузера — данные удалятся.',

  },

    micErr: 'Микрофон қатесі. Safari-де рұқсатты тексеріңіз.', noSR: 'Дауыспен енгізу қолдау таппайды, қолмен енгізіңіз.',
    exp: 'Көшірмені сақтау', imp: 'Файлдан қалпына келтіру',
    impOk: 'Қалпына келтірілді:', impBad: 'Файлды оқу мүмкін болмады.', impAsk: 'Ағымдағы шығындарды файлдағымен алмастырасыз ба?',

    cats: { food:'Тағам', transport:'Көлік', fuel:'Жанармай', cafe:'Кафе және ресторан', home:'Өмір сүру', phone:'Байланыс', health:'Денсаулық', pharmacy:'Дәріхана', clothes:'Киім', fun:'Демалыс', cinema:'Кино', sport:'Спорт', gifts:'Сыйлықтар', education:'Білім', subs:'Жазылымдар', beauty:'Сұлулық және күтім', kids:'Балалар', pets:'Үй жануарлары', travel:'Саяхат', taxes:'Салықтар және төлемдер', other:'Басқа' },
    sr: 'kk-KZ', loc: 'kk-KZ'
  },
  zh: {

    micErr: '麦克风错误。请检查 Safari 的权限。', noSR: '不支持语音输入，请手动输入。',
    exp: '保存备份', imp: '从文件恢复',
    impOk: '已恢复笔数：', impBad: '无法读取文件。', impAsk: '用文件中的数据替换当前支出吗？',

};
let lang = localStorage.getItem('lang') || 'ru';
const $ = id => document.getElementById(id);
const t = () => T[lang];
const catName = c => (ICONS[c] || '') + ' ' + (t().cats[c] || c);
let items = load();
function load() {
  let v = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (v) return v;
  const old = JSON.parse(localStorage.getItem(OLD_KEY) || '[]');
  const catMap = {'Продукты':'food','Транспорт':'transport','Кафе и рестораны':'cafe','Жильё':'home','Связь':'phone','Здоровье':'health','Одежда':'clothes','Развлечения':'fun','Прочее':'other'};
  const year = new Date().getFullYear();
  return old.map(o => ({ sum: o.sum, cat: catMap[o.cat] || 'other', ts: parseOldDate(o.date, year) }));
}
function parseOldDate(s, year) {
  const m = /^(\d{2})\.(\d{2})/.exec(s || '');
  return m ? new Date(year, +m[2] - 1, +m[1], 12, 0).getTime() : Date.now();
}
function save() { localStorage.setItem(KEY, JSON.stringify(items)); }
const fmtSum = n => n.toLocaleString('ru-RU') + ' ₸';
const fmtSumHtml = n => '<span>' + n.toLocaleString('ru-RU') + ' ₸</span>';
function fmtDate(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function applyLang() {
  const L = t();
  document.documentElement.lang = lang;
  $('titleText').textContent = L.title;
  $('mic').textContent = $('mic').classList.contains('rec') ? L.stop : L.voice;
  $('hint').textContent = L.hint;
  $('amount').placeholder = L.amount;
  $('add').textContent = L.add;
  $('thDate').textContent = L.date;
  $('thCat').textContent = L.cat;
  $('thSum').textContent = L.sum;
  $('exportBtn').textContent = '💾 ' + L.exp;
  $('importBtn').textContent = '📂 ' + L.imp;
  $('author').textContent = L.author;
  $('infoTitle').textContent = L.infoTitle;
  $('infoText1').textContent = L.info1;
  $('infoText2').textContent = L.info2;
  $('infoText3').textContent = L.info3;
  const sel = $('cat'), cur = sel.value || 'food';
  sel.innerHTML = CATS.map(c => '<option value="' + c + '">' + catName(c) + '</option>').join('');
  sel.value = cur;
  if (rec) rec.lang = L.sr;
  render();
}
function render() {
  const L = t();
  const tbody = $('rows');
  tbody.innerHTML = '';
  let total = 0, month = 0;
  const now = new Date();
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    total += it.sum;
    const d = new Date(it.ts);
    if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) month += it.sum;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="dt">' + fmtDate(it.ts) + '</td><td>' + catName(it.cat) + '</td><td class="sum">' + fmtSum(it.sum) + '</td><td><button class="del" data-i="' + i + '">' + L.del + '</button></td>';
    tbody.appendChild(tr);
  }
  $('month').innerHTML = L.month + ': ' + fmtSumHtml(month);
  $('total').innerHTML = L.total + ': ' + fmtSumHtml(total);
  renderArchive();
}
function renderArchive() {
  const L = t();
  $('archTitle').textContent = '📅 ' + L.archive;
  const byMonth = {};
  items.forEach(it => {
    const d = new Date(it.ts);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    byMonth[key] = (byMonth[key] || 0) + it.sum;
  });
  const keys = Object.keys(byMonth).sort().reverse();
  $('archive').innerHTML = keys.map(k => {
    const [y, m] = k.split('-');
    const name = new Date(+y, +m - 1, 1).toLocaleDateString(L.loc, { month: 'long', year: 'numeric' });
    return '<div class="arch-row"><span>' + name + '</span><b>' + fmtSum(byMonth[k]) + '</b></div>';
  }).join('');
}
function addItem(sum, cat) {
  if (!sum || sum <= 0) return;
  items.push({ sum: Math.round(sum), cat: cat, ts: Date.now() });
  save();
  render();
}
$('add').onclick = () => {
  const v = parseFloat($('amount').value);
  addItem(v, $('cat').value);
  $('amount').value = '';
};
$('rows').onclick = e => {
  if (e.target.classList.contains('del')) {
    if (confirm(t().confirm)) {
      items.splice(parseInt(e.target.dataset.i), 1);
      save();
      render();
    }
  }
};
$('langBtn').onclick = e => {
  e.stopPropagation();
  $('langBtn').classList.remove('spin'); void $('langBtn').offsetWidth; $('langBtn').classList.add('spin');
  const m = $('langMenu');
  m.style.display = m.style.display === 'block' ? 'none' : 'block';
  setTimeout(()=>{$('langBtn').classList.remove('spin')},800);
};

function parseRu(text) {
  const units = { ноль:0, один:1, одна:1, одну:1, два:2, две:2, три:3, четыре:4, пять:5, шесть:6, семь:7, восемь:8, девять:9, десять:10, одиннадцать:11, двенадцать:12, тринадцать:13, четырнадцать:14, пятнадцать:15, шестнадцать:16, семнадцать:17, восемнадцать:18, девятнадцать:19, двадцать:20, тридцать:30, сорок:40, пятьдесят:50, шестьдесят:60, семьдесят:70, восемьдесят:80, девяносто:90, сто:100, двести:200, триста:300, четыреста:400, пятьсот:500, шестьсот:600, семьсот:700, восемьсот:800, девятьсот:900, полтора:1.5, полторы:1.5 };
  let total = 0, cur = 0, found = false;
  text.split(/\s+/).forEach(w => {
    if (w in units) { cur += units[w]; found = true; }
    else if (/^(тысяч|тыс|тыщ)/.test(w)) { total += (cur || 1) * 1000; cur = 0; found = true; }
    else if (/^(миллион|млн|лям)/.test(w)) { total += (cur || 1) * 1000000; cur = 0; found = true; }
    else if (/^\d+$/.test(w)) { cur += parseInt(w); found = true; }
  });
  total += cur;
  return found ? Math.round(total) : 0;
}
function parseKk(text) {
  const units = { бір:1, екі:2, үш:3, төрт:4, бес:5, алты:6, жеті:7, сегіз:8, тоғыз:9, он:10, жиырма:20, отыз:30, қырық:40, елу:50, алпыс:60, жетпіс:70, сексен:80, тоқсан:90, жүз:100 };
  let total = 0, cur = 0, found = false;
  text.split(/\s+/).forEach(w => {
    if (w in units) {
      if (w === 'жүз') { cur = (cur || 1) * 100; } else { cur += units[w]; }
      found = true;
    }
    else if (/^мың/.test(w) || /^мын/.test(w)) { total += (cur || 1) * 1000; cur = 0; found = true; }
    else if (/^миллион/.test(w)) { total += (cur || 1) * 1000000; cur = 0; found = true; }
    else if (/^\d+$/.test(w)) { cur += parseInt(w); found = true; }
  });
  total += cur;
  return found ? total : 0;
}
function parseZh(text) {
  const d = { '零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9 };
  const arabic = text.replace(/\s/g, '').match(/\d+/);
  if (arabic) {
    let n = parseInt(arabic[0]);
    if (/万/.test(text) && n < 10000) n *= 10000;
    else if (/千/.test(text) && n < 1000) n *= 1000;
    return n;
  }
  let total = 0, section = 0, num = 0, found = false;
  for (const ch of text) {
    if (ch in d) { num = d[ch]; found = true; }
    else if (ch === '十') { section += (num || 1) * 10; num = 0; found = true; }
    else if (ch === '百') { section += (num || 1) * 100; num = 0; found = true; }
    else if (ch === '千') { section += (num || 1) * 1000; num = 0; found = true; }
    else if (ch === '万') { total += (section + num || 1) * 10000; section = 0; num = 0; found = true; }
  }
  total += section + num;
  return found ? total : 0;
}
function parseAmount(text) {
  text = text.toLowerCase().replace(/ё/g, 'е');
  text = text.replace(/(\d)[\s,]+(?=\d)/g, '$1');
  const m = text.match(/(\d+(?:[.,]\d+)?)\s*(тыс|тыщ|мың|мын|млн|миллион|лям|к(?![\p{L}])|k(?![\p{L}]))?/u);
  if (lang !== 'zh' && m) {
    let n = parseFloat(m[1].replace(',', '.'));
    if (m[2]) n *= /^(млн|миллион|лям)/.test(m[2]) ? 1000000 : 1000;
    return Math.round(n);
  }
  if (lang === 'ru') return parseRu(text);
  if (lang === 'kk') return parseKk(text);
  return parseZh(text);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!SR) {
  $('mic').disabled = true;
} else {
  rec = new SR();
  rec.interimResults = false;
  rec.onresult = e => {
    const text = e.results[0][0].transcript;
    const sum = parseAmount(text);
    const L = t();
    if (sum > 0) {
      addItem(sum, $('cat').value);
      $('hint').textContent = L.added + ': ' + fmtSum(sum) + ' (' + L.heard + ': «' + text + '»)';
    } else {
      $('hint').textContent = L.nope + ': «' + text + '». ' + L.again;
    }
  };
  rec.onend = () => { $('mic').classList.remove('rec'); $('mic').textContent = t().voice; };
  rec.onerror = () => { $('hint').textContent = t().micErr; };
  $('mic').onclick = () => {
    if ($('mic').classList.contains('rec')) { rec.stop(); return; }
    rec.lang = t().sr;
    $('mic').classList.add('rec');
    $('mic').textContent = t().stop;
    rec.start();
  };
}
function tick() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  $('clock').textContent = p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
tick();
setInterval(tick, 1000);
applyLang();
if (!SR) $('hint').textContent = t().noSR;
