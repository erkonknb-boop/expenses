function lsGet(k) {

}
function lsSet(k, v) {

}
function has(o, k) {

}

function norm(e) {

  let c = e.cat || e.c || e.category || 'other';

  if (!(a > 0) || !t) return null;
  return { id: e.id || ('x' + t + Math.random()), amount: a, ts: Number(t), cat: c };
}
function normD(e) {
  if (!e || typeof e !== 'object' || !e.name) return null;

  return a.map(norm).filter(Boolean);
}

const p2 = n => ('0' + n).slice(-2);
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + ' ₸';
function fmtDate(ts) {
  const d = new Date(ts);
  return p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(2) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
}
function fmtD(s) {
  const p = String(s).split('-');
  return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0].slice(2) : '—';
}

function monthSpent() {
  const now = new Date();
  let m = 0;
  load().forEach(e => {
    const d = new Date(e.ts);
    if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) m += e.amount;
  });
  return m;
}
function limState() {
  const lim = getLim();
  if (!lim) return null;
  const left = lim - monthSpent();
  return { lim: lim, left: left, lvl: left <= 0 ? 2 : (left <= lim * 0.2 ? 1 : 0) };
}
function renderLimit() {
  const t = T[lang], s = limState();
  const txt = $('limTxt'), bar = $('limBar'), w = $('limWarn');
  w.className = 'warn';
  if (!s) {
    txt.textContent = t.limNone;
    bar.style.width = '0';
    return;
  }
  txt.textContent = t.limLeft + ': ' + fmt(Math.max(s.left, 0)) + ' ' + t.limOf + ' ' + fmt(s.lim);
  bar.style.width = Math.min(100, (s.lim - s.left) / s.lim * 100) + '%';
  bar.style.background = s.lvl === 2 ? '#dc2828' : s.lvl === 1 ? '#e6a014' : '#2ea44f';
  if (s.lvl === 1) { w.className = 'warn l1'; w.textContent = t.limLow; }
  if (s.lvl === 2) { w.className = 'warn l2'; w.textContent = t.limOver + ' ' + fmt(-s.left); }
}

function setText() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $('title').textContent = t.title;
  $('brandBtn').innerHTML = LOGO + '<span>Alpin</span>';
  $('amount').placeholder = t.amount;
  $('add').textContent = t.add;
  $('thDate').textContent = t.date;
  $('thCat').textContent = t.cat;
  $('thSum').textContent = t.sum;
  $('archTitle').textContent = t.archive;
  $('exportBtn').textContent = t.exp;
  $('importBtn').textContent = t.imp;
  $('author').textContent = t.author;
  $('infoTitle').textContent = t.infoTitle;
  $('infoText1').textContent = t.info1;
  $('infoText2').textContent = t.info2;
  $('infoText3').textContent = t.info3;
  $('limTitle').textContent = t.limTitle;
  $('limIn').placeholder = t.limPh;
  $('limSave').textContent = t.limSave;
  $('debtTitle').textContent = t.dTitle;
  $('dName').placeholder = t.dName;
  $('dAmt').placeholder = t.dAmt;
  $('lTaken').textContent = t.dTaken;
  $('lRet').textContent = t.dRet;
  $('dAdd').textContent = t.dAdd;
  const sel = $('cat'), cur = sel.value || 'food';
  sel.innerHTML = '';
  CATS.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = ICONS[c] + ' ' + t.cats[c];
    sel.appendChild(o);
  });
  sel.value = cur;
}

function renderDebts() {
  const t = T[lang], list = loadD(), box = $('debts'), today = todayStr();
  box.innerHTML = '';
  let sum = 0;
  list.sort((a, b) => (a.ret || '9999').localeCompare(b.ret || '9999'));
  list.forEach(d => {
    sum += d.amount;
    const late = d.ret && d.ret < today;
    const r = document.createElement('div'); r.className = 'debt';
    const l = document.createElement('div'); l.className = 'nm';
    const nm = document.createElement('span'); nm.textContent = d.name + ' — ';
    const am = document.createElement('b'); am.textContent = fmt(d.amount);
    l.appendChild(nm); l.appendChild(am);
    const dd = document.createElement('div'); dd.className = 'dd';
    dd.textContent = t.dTook + ' ' + fmtD(d.taken) + ' · ' + t.dTo + ' ' + fmtD(d.ret);
    if (late) {
      const lt = document.createElement('span'); lt.className = 'late'; lt.textContent = ' · ' + t.dLate;
      dd.appendChild(lt);
    }
    l.appendChild(dd);
    const b = document.createElement('button'); b.className = 'del'; b.textContent = t.dDone;
    b.onclick = () => { if (confirm(t.dConfirm)) { saveD(loadD().filter(x => x.id !== d.id)); renderDebts(); } };
    r.appendChild(l); r.appendChild(b);
    box.appendChild(r);
  });
  $('dTotal').innerHTML = t.dTotal + ': <span>' + fmt(sum) + '</span>';
}

function render() {
  const t = T[lang], list = load().sort((a, b) => b.ts - a.ts);
  const body = $('rows');
  body.innerHTML = '';
  let total = 0, month = 0;
  const now = new Date(), months = {};
  list.forEach(e => {
    total += e.amount;
    const d = new Date(e.ts), mk = d.getFullYear() + '-' + p2(d.getMonth() + 1);
    months[mk] = (months[mk] || 0) + e.amount;
    if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) month += e.amount;
    const tr = document.createElement('tr');
    const c1 = document.createElement('td'); c1.className = 'dt'; c1.textContent = fmtDate(e.ts);
    const c2 = document.createElement('td'); c2.textContent = ICONS[e.cat] + ' ' + t.cats[e.cat];
    const c3 = document.createElement('td'); c3.className = 'sum'; c3.textContent = fmt(e.amount);
    const c4 = document.createElement('td');
    const b = document.createElement('button'); b.className = 'del'; b.textContent = t.del;
    b.onclick = () => { if (confirm(t.confirm)) { save(load().filter(x => x.id !== e.id)); render(); } };
    c4.appendChild(b);
    [c1, c2, c3, c4].forEach(c => tr.appendChild(c));
    body.appendChild(tr);
  });
  $('month').innerHTML = t.month + ': <span>' + fmt(month) + '</span>';
  $('total').innerHTML = t.total + ': <span>' + fmt(total) + '</span>';
  const arch = $('archive');
  arch.innerHTML = '';
  Object.keys(months).sort().reverse().forEach(k => {
    const parts = k.split('-'), d = new Date(+parts[0], +parts[1] - 1, 1);
    let name = k;
    try { name = d.toLocaleDateString(t.loc, { month: 'long', year: 'numeric' }); } catch (e) {}
    const r = document.createElement('div'); r.className = 'arch-row';
    const s = document.createElement('span'); s.textContent = name;
    const b = document.createElement('b'); b.textContent = fmt(months[k]);
    r.appendChild(s); r.appendChild(b); arch.appendChild(r);
  });
  renderLimit();
  renderDebts();
}

function addExpense(a) {
  a = Number(a);
  if (!isFinite(a) || a <= 0) return false;
  const before = limState();
  const list = load();
  list.push({ id: 'e' + Date.now() + Math.random().toString(36).slice(2, 6), amount: a, ts: Date.now(), cat: $('cat').value || 'other' });
  save(list);
  $('amount').value = '';
  render();
  const after = limState(), t = T[lang];
  if (after && after.lvl > (before ? before.lvl : 0)) {
    setTimeout(() => alert(after.lvl === 2 ? t.limOver + ' ' + fmt(-after.left) : t.limLow + '\n' + t.limLeft + ': ' + fmt(after.left)), 50);
  }
  return true;
}

$('add').onclick = () => addExpense($('amount').value);
$('amount').addEventListener('keydown', e => { if (e.key === 'Enter') addExpense($('amount').value); });

$('limSave').onclick = () => {
  const v = Number($('limIn').value);
  lsSet(LKEY, v > 0 ? String(v) : '0');
  $('limIn').value = '';
  renderLimit();
};

$('dTaken').value = todayStr();
$('dAdd').onclick = () => {
  const name = $('dName').value.trim(), a = Number($('dAmt').value);
  if (!name || !(a > 0)) { alert(T[lang].dNeed); return; }
  const list = loadD();
  list.push({ id: 'd' + Date.now() + Math.random().toString(36).slice(2, 6), name: name, amount: a, taken: $('dTaken').value || todayStr(), ret: $('dRet').value || '' });
  saveD(list);
  $('dName').value = ''; $('dAmt').value = ''; $('dRet').value = ''; $('dTaken').value = todayStr();
  renderDebts();
};

$('langBtn').onclick = e => {
  e.stopPropagation();
  const g = $('langBtn'); g.classList.remove('spin'); void g.offsetWidth; g.classList.add('spin');
  const m = $('langMenu'); m.style.display = m.style.display === 'block' ? 'none' : 'block';
};
document.addEventListener('click', () => { $('langMenu').style.display = 'none'; });
document.querySelectorAll('#langMenu button').forEach(b => {
  b.onclick = () => { lang = b.dataset.l; lsSet('lang', lang); setText(); render(); };
});

$('infoBtn').onclick = () => $('infoModal').classList.add('open');
$('infoOk').onclick = () => $('infoModal').classList.remove('open');
$('infoModal').onclick = e => { if (e.target === $('infoModal')) $('infoModal').classList.remove('open'); };

$('exportBtn').onclick = () => {
  const data = { expenses: load(), debts: loadD(), limit: getLim() };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'expenses-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
};
$('importBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = ev => {
  const f = ev.target.files[0], t = T[lang];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const raw = JSON.parse(r.result);
      const arr = Array.isArray(raw) ? raw : raw && raw.expenses;
      if (!Array.isArray(arr)) throw new Error('bad');
      const a = arr.map(norm).filter(Boolean);
      if (confirm(t.impAsk)) {
        save(a);
        if (!Array.isArray(raw)) {
          if (Array.isArray(raw.debts)) saveD(raw.debts.map(normD).filter(Boolean));
          if (Number(raw.limit) >= 0) lsSet(LKEY, String(Number(raw.limit) || 0));
        }
        render();
        alert(t.impOk + ' ' + a.length);
      }
    } catch (e) { alert(t.impBad); }
  };
  r.onerror = () => alert(t.impBad);
  r.readAsText(f);
  ev.target.value = '';
};

function tick() {
  const d = new Date();
  $('clock').textContent = p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() + '  ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
}

try { setText(); } catch (e) { showErr('setText: ' + e.message); }
try { render(); } catch (e) { showErr('render: ' + e.message); }
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
