html {background: var(--bg);}

button:active {opacity: .75;}

button.brand svg {width: 20px;height: 20px;}

button.brand span,button.brand svg {position: relative;z-index: 2;}
@keyframes shine {0% { left: -40% }60% { left: 130% }100% { left: 130% }}
button.gray {background: var(--card2);color: #fff;border: 1px solid var(--line);font-size: 16px;padding: 14px 12px;font-weight: 600;}
button.add {font-size: 18px;}
button.del {font-size: 14px;padding: 8px 12px;border-radius: 12px;background: var(--greenbg);color: var(--green);}
input, select {font-size: 17px;padding: 13px;width: 100%;margin-bottom: 8px;color: #fff;font-family: inherit;background: var(--card2);border: 1px solid var(--line);border-radius: 14px;outline: none;}
input:focus, select:focus {border-color: var(--green);}
input::placeholder {color: rgba(255,255,255,.4);}
select option {color: #000;}
label {display: block;font-size: 12px;color: var(--mut);margin: 2px 0 4px 4px;letter-spacing: .5px;text-transform: uppercase;}
.row {display: flex;gap: 8px;}
.row > * {flex: 1;min-width: 0;}
input[type=date] {-webkit-appearance: none;appearance: none;min-width: 0;max-width: 100%;height: 50px;text-align: center;display: block;}
input[type=date]::-webkit-date-and-time-value {text-align: center;min-height: 1.2em;}
.row select, .row input {margin-bottom: 0;}
table {width: 100%;border-collapse: collapse;}
th, td {text-align: left;padding: 11px 4px;border-bottom: 1px solid var(--line);font-size: 14px;vertical-align: middle;}
th {color: var(--mut);font-weight: 600;font-size: 12px;text-transform: uppercase;letter-spacing: .5px;}
td.sum, th.sum {text-align: right;white-space: nowrap;}
td.dt {white-space: nowrap;font-size: 13px;color: var(--mut);}
.total {font-size: 26px;font-weight: 800;text-align: right;margin-top: 10px;}
.total span {color: var(--green);}
.month {font-size: 17px;font-weight: 600;text-align: right;margin-top: 8px;color: var(--mut);}
.month span {color: #fff;}
.author {text-align: center;color: var(--mut);font-size: 14px;margin: 10px 0 0;}
.author a {color: var(--mut);}
.footer-ver {display: flex;justify-content: center;margin-top: 12px;}
.ver {font-size: 12px;color: var(--mut);border: 1px solid var(--line);padding: 5px 14px;border-radius: 20px;background: var(--card);}
.clock {text-align: center;font-size: 18px;font-weight: 600;color: var(--mut);margin: 0 0 14px;font-variant-numeric: tabular-nums;}
.arch-row {display: flex;justify-content: space-between;padding: 13px 4px;border-bottom: 1px solid var(--line);font-size: 16px;}
.arch-row b {font-variant-numeric: tabular-nums;color: var(--green);}
.arch-title {font-size: 13px;font-weight: 700;margin: 0 0 10px;color: var(--mut);letter-spacing: 1px;text-transform: uppercase;}
.bar {height: 10px;border-radius: 8px;background: var(--card2);overflow: hidden;margin: 10px 0 8px;}
.bar i {display: block;height: 100%;width: 0;background: var(--green);transition: width .3s;border-radius: 8px;}
.limtxt {font-size: 20px;font-weight: 700;}
.warn {display: none;margin-top: 8px;padding: 10px 12px;border-radius: 14px;font-size: 14px;font-weight: 600;}
.warn.l1 {display: block;background: rgba(230,160,20,.2);border: 1px solid #e6a014;}
.warn.l2 {display: block;background: rgba(220,40,40,.22);border: 1px solid #dc2828;}
.sums {display: flex;gap: 10px;margin-bottom: 14px;}
.sumc {flex: 1;background: var(--card);border: 1px solid var(--line);border-radius: 22px;padding: 14px;min-width: 0;}
.sumc .ic {width: 38px;height: 38px;border-radius: 12px;background: var(--greenbg);display: flex;align-items: center;justify-content: center;font-size: 18px;margin-bottom: 10px;color: var(--green);}
.sumc .ic.r {background: #3a2222;color: var(--red);}
.sumc .l {font-size: 14px;color: var(--mut);font-weight: 600;}
.sumc .v {font-size: 22px;font-weight: 800;color: var(--green);margin-top: 2px;white-space: nowrap;}
.sumc .v.r {color: var(--red);}
.sumc .s {font-size: 13px;color: var(--mut);margin-top: 2px;}
.dc {background: var(--card);border: 1px solid var(--line);border-radius: 22px;padding: 16px;margin-bottom: 12px;}
.dc .h {display: flex;justify-content: space-between;align-items: center;gap: 8px;}
.dc .n {font-size: 22px;font-weight: 700;}
.dc .badge {background: var(--greenbg);color: var(--green);font-weight: 700;font-size: 14px;padding: 5px 10px;border-radius: 12px;white-space: nowrap;}
.dc .sub {font-size: 15px;color: var(--mut);margin-top: 6px;}
.dc .sub .late {color: var(--red);font-weight: 700;}
.dc .pb {height: 10px;border-radius: 8px;background: var(--card2);overflow: hidden;margin: 12px 0 10px;}
.dc .pb i {display: block;height: 100%;background: var(--green);border-radius: 8px;}
.dc .pb i.r {background: var(--red);}
.dc .f {display: flex;justify-content: space-between;align-items: center;color: var(--mut);font-size: 14px;}
button.wide {width: 100%;background: var(--greenbg);color: var(--green);border: 1px solid var(--line);margin-bottom: 14px;}
.tab {display: none;}
.tab.active {display: block;}
.nav {position: fixed;left: 14px;right: 14px;bottom: calc(12px + env(safe-area-inset-bottom));background: rgba(28,28,30,.92);-webkit-backdrop-filter: blur(20px);backdrop-filter: blur(20px);border: 1px solid var(--line);border-radius: 32px;display: flex;padding: 6px;z-index: 50;}
.nav button {flex: 1;background: transparent;color: var(--mut);border: 1px solid transparent;border-radius: 26px;padding: 8px 2px;font-size: 11px;font-weight: 700;display: flex;flex-direction: column;align-items: center;gap: 3px;min-width: 0;}
.nav button svg {width: 24px;height: 24px;fill: none;stroke: currentColor;stroke-width: 1.8;stroke-linecap: round;stroke-linejoin: round;}
.nav button.on {background: var(--greenbg);color: var(--green);border-color: #2f5a3d;}
.nav button span {max-width: 100%;overflow: hidden;text-overflow: ellipsis;white-space: nowrap;}
.langs {display: flex;gap: 8px;}
.langs button {flex: 1;background: var(--card2);color: #fff;border: 1px solid var(--line);font-size: 15px;padding: 12px 6px;font-weight: 600;}
.langs button.on {background: var(--greenbg);color: var(--green);border-color: #2f5a3d;}
.prow {display: flex;justify-content: space-between;align-items: center;padding: 4px 0;font-size: 17px;font-weight: 600;width: 100%;background: transparent;color: #fff;border-radius: 0;text-align: left;}
.modal {display: none;position: fixed;inset: 0;background: rgba(0,0,0,.7);-webkit-backdrop-filter: blur(8px);backdrop-filter: blur(8px);z-index: 100;align-items: center;justify-content: center;padding: 20px;}
.modal.open {display: flex;}
.modalbox {background: var(--card);border: 1px solid var(--line);border-radius: 24px;padding: 20px;max-width: 420px;width: 100%;}
.modalbox h3 {margin: 0 0 10px;font-size: 18px;color: #fff;}
.modalbox p {font-size: 14px;line-height: 1.5;color: rgba(255,255,255,.75);margin: 8px 0;}
.modalbox .ok {width: 100%;margin-top: 12px;}
#err {display: none;background: #3a1414;border: 1px solid #a33;border-radius: 14px;padding: 10px;margin-bottom: 12px;font-size: 13px;}

dAmt: '欠款金额, ₸',
dTaken: '借款日期',
dRet: '还款日期',
dAdd: '添加欠款人',
dToggle: '+ 添加欠款',
dDone: '已还',
dConfirm: '对方已还钱？记录将被删除。',
dTotal: '别人欠我',
dLate: '已逾期',
dPpl: '人',
dCnt: '笔',
dLeft: '剩余',
dDay: '天',
dWill: '还款日',
dNoDate: '未设期限',
dNeed: '请填写姓名和金额。',
cats: { food:'食品', transport:'交通', fuel:'加油', cafe:'餐厅', home:'住房', phone:'通讯', health:'健康', pharmacy:'药店', clothes:'服装', fun:'娱乐', cinema:'电影', sport:'运动', gifts:'礼物', education:'教育', subs:'订阅', beauty:'美容', kids:'孩子', pets:'宠物', travel:'旅行', taxes:'税费', other:'其他' },
loc: 'zh-CN'
}
};

function lsGet(k) {
  try { return localStorage.getItem(k); } catch (e) { return null; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, v); } catch (e) {}
}
function has(o, k) {
  return Object.prototype.hasOwnProperty.call(o, k);
}

const $ = id => document.getElementById(id);
function showErr(m) { const e = $('err'); e.style.display = 'block'; e.textContent = 'Ошибка: ' + m; }
window.addEventListener('error', ev => showErr(ev.message));
window.addEventListener('unhandledrejection', ev => showErr(String(ev.reason)));

let lang = lsGet('lang');
if (!has(T, lang)) lang = 'ru';
let mem = null, dmem = null;

function norm(e) {
  if (!e || typeof e !== 'object') return null;
  const a = Number(e.amount != null ? e.amount : e.a != null ? e.a : e.sum);
  let t = e.ts || e.t || e.date || e.time || e.id;
  if (typeof t === 'string') t = Date.parse(t) || Number(t);
  let c = e.cat || e.c || e.category || 'other';
  if (!has(ICONS, c)) c = 'other';
  if (!(a > 0) || !t) return null;
  return { id: e.id || ('x' + t + Math.random()), amount: a, ts: Number(t), cat: c };
}
function normD(e) {
  if (!e || typeof e !== 'object' || !e.name) return null;
  const a = Number(e.amount);
  if (!(a > 0)) return null;
  return { id: e.id || ('d' + Date.now() + Math.random()), name: String(e.name), amount: a, taken: String(e.taken || ''), ret: String(e.ret || '') };
}
function load() {
  if (mem) return mem;
  let a = [];
  try { a = JSON.parse(lsGet(KEY) || lsGet(OLD_KEY) || '[]'); } catch (e) {}
  if (!Array.isArray(a)) a = [];
  return a.map(norm).filter(Boolean);
}
function save(list) {
  mem = list;
  lsSet(KEY, JSON.stringify(list));
}
function loadD() {
  if (dmem) return dmem;
  let a = [];
  try { a = JSON.parse(lsGet(DKEY) || '[]'); } catch (e) {}
  if (!Array.isArray(a)) a = [];
  return a.map(normD).filter(Boolean);
}
function saveD(list) {
  dmem = list;
  lsSet(DKEY, JSON.stringify(list));
}
function getLim() { return Number(lsGet(LKEY)) || 0; }

const p2 = n => ('0' + n).slice(-2);
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + ' ₸';
function fmtDate(ts) {
  const d = new Date(ts);
  return p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(2) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
}
function dayNum(s) {
  const p = String(s).split('-');
  if (p.length !== 3) return NaN;
  return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
}
function fmtLong(s) {
  const p = String(s).split('-');
  if (p.length !== 3) return '—';
  try { return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(T[lang].loc, { day: 'numeric', month: 'long' }); } catch (e) { return p[2] + '.' + p[1]; }
}

function monthSpent() {
  const now = new Date();
  let m = 0;
  load().forEach(e => {
    const d = new Date(e.ts);
    if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) m += e.amount;
  });
  return m;
}
function limState() {
  const lim = getLim();
  if (!lim) return null;
  const left = lim - monthSpent();
  return { lim: lim, left: left, lvl: left <= 0 ? 2 : (left <= lim * 0.2 ? 1 : 0) };
}
function renderLimit() {
  const t = T[lang], s = limState();
  const txt = $('limTxt'), bar = $('limBar'), w = $('limWarn');
  w.className = 'warn';
  if (!s) {
    txt.textContent = t.limNone;
    bar.style.width = '0';
    return;
  }
  txt.textContent = t.limLeft + ': ' + fmt(Math.max(s.left, 0)) + ' ' + t.limOf + ' ' + fmt(s.lim);
  bar.style.width = Math.min(100, (s.lim - s.left) / s.lim * 100) + '%';
  bar.style.background = s.lvl === 2 ? '#dc2828' : s.lvl === 1 ? '#e6a014' : '#68d18a';
  if (s.lvl === 1) { w.className = 'warn l1'; w.textContent = t.limLow; }
  if (s.lvl === 2) { w.className = 'warn l2'; w.textContent = t.limOver + ' ' + fmt(-s.left); }
}

function setText() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $('title').textContent = t.title;
  $('brandBtn').innerHTML = LOGO + '<span>Alpin</span>';
  $('nHome').textContent = t.nHome;
  $('nFin').textContent = t.nFin;
  $('nOps').textContent = t.nOps;
  $('nDebts').textContent = t.nDebts;
  $('nProf').textContent = t.nProf;
  $('langTitle').textContent = t.langTitle;
  $('infoRow').textContent = t.infoRow;
  $('amount').placeholder = t.amount;
  $('add').textContent = t.add;
  $('thDate').textContent = t.date;
  $('thCat').textContent = t.cat;
  $('thSum').textContent = t.sum;
  $('archTitle').textContent = t.archive;
  $('exportBtn').textContent = t.exp;
  $('importBtn').textContent = t.imp;
  $('author').textContent = t.author;
  $('infoTitle').textContent = t.infoTitle;
  $('infoText1').textContent = t.info1;
  $('infoText2').textContent = t.info2;
  $('infoText3').textContent = t.info3;
  $('limTitle').textContent = t.limTitle;
  $('limIn').placeholder = t.limPh;
  $('limSave').textContent = t.limSave;
  $('dName').placeholder = t.dName;
  $('dAmt').placeholder = t.dAmt;
  $('lTaken').textContent = t.dTaken;
  $('lRet').textContent = t.dRet;
  $('dAdd').textContent = t.dAdd;
  $('dToggle').textContent = t.dToggle;
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  const sel = $('cat'), cur = sel.value || 'food';
  sel.innerHTML = '';
  CATS.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = ICONS[c] + ' ' + t.cats[c];
    sel.appendChild(o);
  });
  sel.value = cur;
}

function renderDebts() {
  const t = T[lang], list = loadD(), box = $('debts'), today = todayStr(), tn = dayNum(today);
  box.innerHTML = '';
  let sum = 0, lateN = 0, lateS = 0;
  list.sort((a, b) => (a.ret || '9999').localeCompare(b.ret || '9999'));
  list.forEach(d => {
    sum += d.amount;
    const late = d.ret && d.ret < today;
    if (late) { lateN++; lateS += d.amount; }
    const c = document.createElement('div'); c.className = 'dc';
    const h = document.createElement('div'); h.className = 'h';
    const n = document.createElement('div'); n.className = 'n'; n.textContent = d.name;
    const bd = document.createElement('div'); bd.className = 'badge'; bd.textContent = fmt(d.amount);
    h.appendChild(n); h.appendChild(bd);
    const sub = document.createElement('div'); sub.className = 'sub';
    let pct = 0;
    if (d.ret) {
      const rn = dayNum(d.ret), left = rn - tn;
      if (late) {
        sub.innerHTML = '';
        const sp = document.createElement('span'); sp.className = 'late'; sp.textContent = t.dLate + ' ' + (-left) + ' ' + t.dDay;
        sub.appendChild(sp);
        sub.appendChild(document.createTextNode(' · ' + t.dWill + ' ' + fmtLong(d.ret)));
        pct = 100;
      } else {
        sub.textContent = t.dLeft + ' ' + left + ' ' + t.dDay + ' · ' + t.dWill + ' ' + fmtLong(d.ret);
        const tk = dayNum(d.taken);
        if (isFinite(tk) && rn > tk) pct = Math.max(0, Math.min(100, (tn - tk) / (rn - tk) * 100));
      }
    } else {
      sub.textContent = t.dNoDate;
    }
    const pb = document.createElement('div'); pb.className = 'pb';
    const pi = document.createElement('i'); pi.style.width = pct + '%'; if (late) pi.className = 'r';
    pb.appendChild(pi);
    const f = document.createElement('div'); f.className = 'f';
    const fs = document.createElement('span'); fs.textContent = fmt(d.amount);
    const b = document.createElement('button'); b.className = 'del'; b.textContent = t.dDone;
    b.onclick = () => { if (confirm(t.dConfirm)) { saveD(loadD().filter(x => x.id !== d.id)); renderDebts(); } };
    f.appendChild(fs); f.appendChild(b);
    c.appendChild(h); c.appendChild(sub); c.appendChild(pb); c.appendChild(f);
    box.appendChild(c);
  });
  $('sOwedL').textContent = t.dTotal;
  $('sOwedV').textContent = fmt(sum);
  $('sOwedS').textContent = list.length + ' ' + t.dPpl;
  $('sLateL').textContent = t.dLate;
  $('sLateV').textContent = fmt(lateS);
  $('sLateS').textContent = lateN + ' ' + t.dCnt;
}

function render() {
  const t = T[lang], list = load().sort((a, b) => b.ts - a.ts);
  const body = $('rows');
  body.innerHTML = '';
  let total = 0, month = 0;
  const now = new Date(), months = {};
  list.forEach(e => {
    total += e.amount;
    const d = new Date(e.ts), mk = d.getFullYear() + '-' + p2(d.getMonth() + 1);
    months[mk] = (months[mk] || 0) + e.amount;
    if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) month += e.amount;
    const tr = document.createElement('tr');
    const c1 = document.createElement('td'); c1.className = 'dt'; c1.textContent = fmtDate(e.ts);
    const c2 = document.createElement('td'); c2.textContent = ICONS[e.cat] + ' ' + t.cats[e.cat];
    const c3 = document.createElement('td'); c3.className = 'sum'; c3.textContent = fmt(e.amount);
    const c4 = document.createElement('td');
    const b = document.createElement('button'); b.className = 'del'; b.textContent = t.del;
    b.onclick = () => { if (confirm(t.confirm)) { save(load().filter(x => x.id !== e.id)); render(); } };
    c4.appendChild(b);
    [c1, c2, c3, c4].forEach(c => tr.appendChild(c));
    body.appendChild(tr);
  });
  $('month').innerHTML = t.month + ': <span>' + fmt(month) + '</span>';
  $('total').innerHTML = t.total + ': <span>' + fmt(total) + '</span>';
  const arch = $('archive');
  arch.innerHTML = '';
  Object.keys(months).sort().reverse().forEach(k => {
    const parts = k.split('-'), d = new Date(+parts[0], +parts[1] - 1, 1);
    let name = k;
    try { name = d.toLocaleDateString(t.loc, { month: 'long', year: 'numeric' }); } catch (e) {}
    const r = document.createElement('div'); r.className = 'arch-row';
    const s = document.createElement('span'); s.textContent = name;
    const b = document.createElement('b'); b.textContent = fmt(months[k]);
    r.appendChild(s); r.appendChild(b); arch.appendChild(r);
  });
  renderLimit();
  renderDebts();
}

function addExpense(a) {
  a = Number(a);
  if (!isFinite(a) || a <= 0) return false;
  const before = limState();
  const list = load();
  list.push({ id: 'e' + Date.now() + Math.random().toString(36).slice(2, 6), amount: a, ts: Date.now(), cat: $('cat').value || 'other' });
  save(list);
  $('amount').value = '';
  render();
  const after = limState(), t = T[lang];
  if (after && after.lvl > (before ? before.lvl : 0)) {
    setTimeout(() => alert(after.lvl === 2 ? t.limOver + ' ' + fmt(-after.left) : t.limLow + '\n' + t.limLeft + ': ' + fmt(after.left)), 50);
  }
  return true;
}

$('add').onclick = () => addExpense($('amount').value);
$('amount').addEventListener('keydown', e => { if (e.key === 'Enter') addExpense($('amount').value); });

$('limSave').onclick = () => {
  const v = Number($('limIn').value);
  lsSet(LKEY, v > 0 ? String(v) : '0');
  $('limIn').value = '';
  renderLimit();
};

$('dTaken').value = todayStr();
$('dToggle').onclick = () => {
  const f = $('dForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
};
$('dAdd').onclick = () => {
  const name = $('dName').value.trim(), a = Number($('dAmt').value);
  if (!name || !(a > 0)) { alert(T[lang].dNeed); return; }
  const list = loadD();
  list.push({ id: 'd' + Date.now() + Math.random().toString(36).slice(2, 6), name: name, amount: a, taken: $('dTaken').value || todayStr(), ret: $('dRet').value || '' });
  saveD(list);
  $('dName').value = ''; $('dAmt').value = ''; $('dRet').value = ''; $('dTaken').value = todayStr();
  $('dForm').style.display = 'none';
  renderDebts();
};

document.querySelectorAll('#langs button').forEach(b => {
  b.onclick = () => { lang = b.dataset.l; lsSet('lang', lang); setText(); render(); };
});

function showTab(n) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  const el = $('tab-' + n);
  if (!el) n = 'home';
  $('tab-' + n).classList.add('active');
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === n));
  lsSet('tab', n);
  window.scrollTo(0, 0);
}
document.querySelectorAll('#nav button').forEach(b => {
  b.onclick = () => showTab(b.dataset.t);
});

$('infoBtn').onclick = () => $('infoModal').classList.add('open');
$('infoOk').onclick = () => $('infoModal').classList.remove('open');
$('infoModal').onclick = e => { if (e.target === $('infoModal')) $('infoModal').classList.remove('open'); };

$('exportBtn').onclick = () => {
  const data = { expenses: load(), debts: loadD(), limit: getLim() };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'expenses-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
};
$('importBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = ev => {
  const f = ev.target.files[0], t = T[lang];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const raw = JSON.parse(r.result);
      const arr = Array.isArray(raw) ? raw : raw && raw.expenses;
      if (!Array.isArray(arr)) throw new Error('bad');
      const a = arr.map(norm).filter(Boolean);
      if (confirm(t.impAsk)) {
        save(a);
        if (!Array.isArray(raw)) {
          if (Array.isArray(raw.debts)) saveD(raw.debts.map(normD).filter(Boolean));
          if (Number(raw.limit) >= 0) lsSet(LKEY, String(Number(raw.limit) || 0));
        }
        render();
        alert(t.impOk + ' ' + a.length);
      }
    } catch (e) { alert(t.impBad); }
  };
  r.onerror = () => alert(t.impBad);
  r.readAsText(f);
  ev.target.value = '';
};

function tick() {
  const d = new Date();
  $('clock').textContent = p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() + '  ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
}

try { setText(); } catch (e) { showErr('setText: ' + e.message); }
try { render(); } catch (e) { showErr('render: ' + e.message); }
showTab(lsGet('tab') || 'home');
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
