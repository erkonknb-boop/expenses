<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="ru">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расходы">
<title>Расходы</title>
<style>
:root{--bg:#07070b;--card:#17171c;--line:#2c2c34;--text:#f2f2f5;--mute:#9a9aa6;--red:#8a1f38;--red2:#5e1527}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",Arial,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);max-width:560px;margin:0 auto;background:radial-gradient(120% 40% at 0 0,#2a0b14 0,transparent 70%),var(--bg)}
.bar{display:flex;justify-content:flex-end;gap:10px;margin-bottom:14px}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px}
.lang{background:var(--red);border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:4px 4px 14px}
button,input,select{font:inherit;color:var(--text)}
.btn{background:linear-gradient(var(--red),var(--red2));border:0;border-radius:18px;padding:14px;font-weight:600;width:100%}
.btn:active{opacity:.8}
.mic{font-size:18px;padding:22px}
.mic.on{outline:2px solid #ff6b88}
.field{width:100%;background:#26262d;border:1px solid #444450;border-radius:16px;padding:14px;margin-bottom:10px;font-size:18px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.hint{color:var(--mute);font-size:14px;margin:8px 4px 0;min-height:20px}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
td.n,th.n{text-align:right;white-space:nowrap}
td.x{width:32px;text-align:center;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:14px 0}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700}
#err{display:none;background:#4a1018;border:1px solid #a33;border-radius:16px;padding:12px;margin-bottom:14px;font-size:14px;white-space:pre-wrap}
a{color:var(--mute)}.foot{text-align:center;color:var(--mute);font-size:14px}
.ver{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 14px;margin-top:10px}
</style>
</head>
<body>
<div id="err"></div>
<div class="bar">
  <button class="round lang" id="lang" aria-label="Language">🌐</button>
  <button class="round" id="info" aria-label="Info">i</button>
</div>

<div class="card">
  <button class="btn mic" id="mic"><span data-i="mic">🎤 Сказать сумму</span></button>
  <div class="hint" id="hint"></div>
</div>

<div class="card">
  <input class="field" id="amount" type="number" inputmode="decimal" placeholder="Сумма, ₸" data-ph="amount">
  <div class="row">
    <select class="field" id="cat" style="margin:0"></select>
    <button class="btn" id="add" data-i="add">Добавить</button>
  </div>
</div>

<div class="card">
  <table>
    <thead><tr><th data-i="date">Дата</th><th data-i="category">Категория</th><th class="n" data-i="sum">Сумма</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" data-i="empty">Пока нет расходов</div>
</div>

<div class="card total"><span data-i="total">Итого</span><span id="total">0 ₸</span></div>

<div class="card row">
  <button class="btn" id="csv" data-i="csv">Скачать CSV</button>
  <button class="btn" id="clear" data-i="clear">Очистить</button>
</div>

<div class="foot">
  <a href="https://instagram.com/duisembaev_16">📷 Instagram: @duisembaev_16</a><br>
  <span class="ver">v0.4</span>
</div>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };

/* Любая ошибка показывается на экране, а не молча ломает страницу */
function showErr(m) { var e = $("err"); e.style.display = "block"; e.textContent = "Ошибка: " + m; }
window.addEventListener("error", function (ev) { showErr(ev.message); });
window.addEventListener("unhandledrejection", function (ev) { showErr(String(ev.reason)); });

/* Хранилище с запасным вариантом */
var mem = [];
function load() { try { return JSON.parse(localStorage.getItem("exp_v1") || "[]"); } catch (e) { return mem; } }
function save(d) { mem = d; try { localStorage.setItem("exp_v1", JSON.stringify(d)); } catch (e) {} }

/* Тексты: русский уже в HTML, JS только переключает язык */
var T = {
  ru: { mic: "🎤 Сказать сумму", amount: "Сумма, ₸", add: "Добавить", date: "Дата", category: "Категория", sum: "Сумма", empty: "Пока нет расходов", total: "Итого", csv: "Скачать CSV", clear: "Очистить", listen: "Слушаю…", heard: "Услышал: ", nomatch: "Не понял сумму, попробуй ещё раз", nosr: "Голосовой ввод не поддерживается, введи вручную", confirm: "Удалить все расходы?", info: "Говори только сумму, например «тысяча тенге».", cats: ["Еда","Транспорт","Жильё","Здоровье","Развлечения","Одежда","Связь","Прочее"], loc: "ru-RU" },
  kk: { mic: "🎤 Соманы айту", amount: "Сома, ₸", add: "Қосу", date: "Күні", category: "Санат", sum: "Сома", empty: "Шығыстар жоқ", total: "Барлығы", csv: "CSV жүктеу", clear: "Тазалау", listen: "Тыңдап тұрмын…", heard: "Естідім: ", nomatch: "Соманы түсінбедім", nosr: "Дауыспен енгізу жоқ, қолмен енгізіңіз", confirm: "Барлық шығысты жою керек пе?", info: "Тек соманы айтыңыз.", cats: ["Тамақ","Көлік","Тұрғын үй","Денсаулық","Көңіл көтеру","Киім","Байланыс","Басқа"], loc: "kk-KZ" },
  en: { mic: "🎤 Say the amount", amount: "Amount, ₸", add: "Add", date: "Date", category: "Category", sum: "Amount", empty: "No expenses yet", total: "Total", csv: "Download CSV", clear: "Clear", listen: "Listening…", heard: "Heard: ", nomatch: "Couldn't get the amount, try again", nosr: "Voice input unavailable, type it in", confirm: "Delete all expenses?", info: "Say just the amount, e.g. “one thousand tenge”.", cats: ["Food","Transport","Housing","Health","Fun","Clothes","Phone","Other"], loc: "en-US" }
};
var order = ["ru", "kk", "en"], lang = "ru";
try { lang = localStorage.getItem("exp_lang") || "ru"; } catch (e) {}
if (!T[lang]) lang = "ru";

function applyLang() {
  var t = T[lang];
  document.documentElement.lang = lang;
  [].forEach.call(document.querySelectorAll("[data-i]"), function (n) { if (t[n.dataset.i]) n.textContent = t[n.dataset.i]; });
  [].forEach.call(document.querySelectorAll("[data-ph]"), function (n) { if (t[n.dataset.ph]) n.placeholder = t[n.dataset.ph]; });
  var sel = $("cat"), cur = sel.selectedIndex < 0 ? 0 : sel.selectedIndex;
  sel.innerHTML = "";
  t.cats.forEach(function (c, i) { var o = document.createElement("option"); o.value = i; o.textContent = c; sel.appendChild(o); });
  sel.selectedIndex = cur;
  render();
}

function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0") + " ₸"; }

function render() {
  var d = load(), t = T[lang], body = $("rows"), sum = 0;
  body.innerHTML = "";
  d.slice().reverse().forEach(function (e) {
    sum += e.a;
    var tr = document.createElement("tr");
    var dt = new Date(e.t);
    var cells = [("0" + dt.getDate()).slice(-2) + "." + ("0" + (dt.getMonth() + 1)).slice(-2), t.cats[e.c] || t.cats[7], fmt(e.a)];
    cells.forEach(function (v, i) { var td = document.createElement("td"); if (i === 2) td.className = "n"; td.textContent = v; tr.appendChild(td); });
    var x = document.createElement("td"); x.className = "x"; x.textContent = "✕";
    x.onclick = function () { save(load().filter(function (z) { return z.t !== e.t; })); render(); };
    tr.appendChild(x); body.appendChild(tr);
  });
  $("empty").style.display = d.length ? "none" : "block";
  $("total").textContent = fmt(sum);
}

function addExpense(a) {
  a = Number(a);
  if (!isFinite(a) || a <= 0) return false;
  var d = load(); d.push({ a: a, c: Number($("cat").value) || 0, t: Date.now() }); save(d);
  $("amount").value = ""; render(); return true;
}

/* Разбор суммы из речи: цифры или слова (рус.) */
var W = { "ноль":0,"один":1,"одна":1,"два":2,"две":2,"три":3,"четыре":4,"пять":5,"шесть":6,"семь":7,"восемь":8,"девять":9,"десять":10,"одиннадцать":11,"двенадцать":12,"тринадцать":13,"четырнадцать":14,"пятнадцать":15,"шестнадцать":16,"семнадцать":17,"восемнадцать":18,"девятнадцать":19,"двадцать":20,"тридцать":30,"сорок":40,"пятьдесят":50,"шестьдесят":60,"семьдесят":70,"восемьдесят":80,"девяносто":90,"сто":100,"двести":200,"триста":300,"четыреста":400,"пятьсот":500,"шестьсот":600,"семьсот":700,"восемьсот":800,"девятьсот":900 };
function parseAmount(s) {
  s = s.toLowerCase().replace(/ё/g, "е").replace(/,/g, ".");
  var m = s.match(/\d[\d\s.]*/);
  if (m) {
    var num = parseFloat(m[0].replace(/\s/g, ""));
    if (/тысяч|тыс|\bk\b|к\b/.test(s.slice(m.index + m[0].length))) num *= 1000;
    else if (/миллион|млн/.test(s)) num *= 1e6;
    if (num > 0) return num;
  }
  var total = 0, cur = 0, found = false;
  s.split(/\s+/).forEach(function (w) {
    if (W[w] !== undefined) { cur += W[w]; found = true; }
    else if (/^тысяч|^тыс/.test(w)) { total += (cur || 1) * 1000; cur = 0; found = true; }
    else if (/^миллион|^млн/.test(w)) { total += (cur || 1) * 1e6; cur = 0; found = true; }
  });
  total += cur;
  return found && total > 0 ? total : 0;
}

/* Голос */
var rec = null;
$("mic").onclick = function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, t = T[lang], hint = $("hint");
  if (!SR) { hint.textContent = t.nosr; return; }
  if (rec) { try { rec.stop(); } catch (e) {} return; }
  rec = new SR(); rec.lang = t.loc; rec.interimResults = false; rec.maxAlternatives = 3;
  $("mic").classList.add("on"); hint.textContent = t.listen;
  rec.onresult = function (ev) {
    var said = ev.results[0][0].transcript, amt = 0;
    for (var i = 0; i < ev.results[0].length && !amt; i++) amt = parseAmount(ev.results[0][i].transcript);
    hint.textContent = t.heard + said;
    if (amt) addExpense(amt); else hint.textContent = t.nomatch;
  };
  rec.onerror = function (ev) { hint.textContent = ev.error === "not-allowed" ? t.nosr : t.nomatch; };
  rec.onend = function () { rec = null; $("mic").classList.remove("on"); };
  try { rec.start(); } catch (e) { rec = null; $("mic").classList.remove("on"); showErr(e.message); }
};

$("add").onclick = function () { addExpense($("amount").value); };
$("amount").addEventListener("keydown", function (e) { if (e.key === "Enter") addExpense($("amount").value); });
$("lang").onclick = function () {
  lang = order[(order.indexOf(lang) + 1) % order.length];
  try { localStorage.setItem("exp_lang", lang); } catch (e) {}
  applyLang();
};
$("info").onclick = function () { $("hint").textContent = T[lang].info; };
$("clear").onclick = function () { if (confirm(T[lang].confirm)) { save([]); render(); } };
$("csv").onclick = function () {
  var t = T[lang], lines = ["date;category;amount"];
  load().forEach(function (e) { lines.push(new Date(e.t).toISOString().slice(0, 10) + ";" + (t.cats[e.c] || "") + ";" + e.a); });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" }));
  a.download = "expenses.csv"; document.body.appendChild(a); a.click(); a.remove();
};

applyLang();
</script>
</body>
</html>
