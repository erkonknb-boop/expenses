function parseAnyDate(s){
  if(!s) return Date.now();
  if(typeof s === 'number') return s;
  s = String(s).trim();
  let m = s.match(/(\d{1,2})\.(\d{4})[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5], +(m[6]||0)).getTime();
  m = s.match(/(\d{1,2})\.(\d{1,2})/);
  if(m){ let y=new Date().getFullYear(); return new Date(y, +m[2]-1, +m[1], 12, 0).getTime(); }
  let d = Date.parse(s); return isNaN(d) ? Date.now() : d;
}
function load(){
  let v = JSON.parse(localStorage.getItem(NEW_KEY) || 'null');
  if(Array.isArray(v) && v.length>0) return v;
  for(let k of OLD_KEYS){
    try{
      let raw = localStorage.getItem(k);
      if(!raw) continue;
      let arr = JSON.parse(raw);
      if(!Array.isArray(arr) || arr.length===0) continue;
      let norm = arr.map(o=>{
        if(o.ts) return { sum:o.sum, cat:o.cat || 'other', ts: parseAnyDate(o.ts) };
        if(o.date) return { sum:o.sum, cat: (function(){ let map={'Продукты':'food','Транспорт':'transport','Кафе и рестораны':'cafe','Жильё':'home','Связь':'phone','Здоровье':'health','Одежда':'clothes','Развлечения':'fun','Прочее':'other'}; return map[o.cat]||'other'; })(), ts: parseAnyDate(o.date) };
        if(typeof o.sum==='number') return { sum:o.sum, cat:o.cat||'food', ts: parseAnyDate(o.date||o.time||Date.now()) };
        return null;
      }).filter(Boolean);
      if(norm.length>0){ localStorage.setItem(NEW_KEY, JSON.stringify(norm)); return norm; }
    }catch(e){}
  }
  return [];
}
let items = load();

function parseRu(text){
  const units={ ноль:0, один:1, одна:1, одну:1, два:2, две:2, три:3, четыре:4, пять:5, шесть:6, семь:7, восемь:8, девять:9, десять:10, одиннадцать:11, двенадцать:12, тринадцать:13, четырнадцать:14, пятнадцать:15, шестнадцать:16, семнадцать:17, восемнадцать:18, девятнадцать:19, двадцать:20, тридцать:30, сорок:40, пятьдесят:50, шестьдесят:60, семьдесят:70, восемьдесят:80, девяносто:90, сто:100, двести:200, триста:300, четыреста:400, пятьсот:500, шестьсот:600, семьсот:700, восемьсот:800, девятьсот:900, полтора:1.5, полторы:1.5 };
  let total=0, cur=0, found=false; text.split(/\s+/).forEach(w=>{ if(w in units){ cur+=units[w]; found=true; } else if(/^(тысяч|тыс|тыщ)/.test(w)){ total+=(cur||1)*1000; cur=0; found=true; } else if(/^(миллион|млн|лям)/.test(w)){ total+=(cur||1)*1000000; cur=0; found=true; } else if(/^\d+$/.test(w)){ cur+=parseInt(w); found=true; } }); total+=cur; return found?Math.round(total):0;
}
function parseKk(text){
  const units={ бір:1, екі:2, үш:3, төрт:4, бес:5, алты:6, жеті:7, сегіз:8, тоғыз:9, он:10, жиырма:20, отыз:30, қырық:40, елу:50, алпыс:60, жетпіс:70, сексен:80, тоқсан:90, жүз:100 };
  let total=0, cur=0, found=false; text.split(/\s+/).forEach(w=>{ if(w in units){ if(w==='жүз'){ cur=(cur||1)*100; } else { cur+=units[w]; } found=true; } else if(/^мың/.test(w)||/^мын/.test(w)){ total+=(cur||1)*1000; cur=0; found=true; } else if(/^миллион/.test(w)){ total+=(cur||1)*1000000; cur=0; found=true; } else if(/^\d+$/.test(w)){ cur+=parseInt(w); found=true; } }); total+=cur; return found?total:0;
}
function parseZh(text){
  const d={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9}; const arabic=text.replace(/\s/g,'').match(/\d+/); if(arabic){ let n=parseInt(arabic[0]); if(/万/.test(text)&&n<10000) n*=10000; else if(/千/.test(text)&&n<1000) n*=1000; return n; } let total=0, section=0, num=0, found=false; for(const ch of text){ if(ch in d){ num=d[ch]; found=true; } else if(ch==='十'){ section+=(num||1)*10; num=0; found=true; } else if(ch==='百'){ section+=(num||1)*100; num=0; found=true; } else if(ch==='千'){ section+=(num||1)*1000; num=0; found=true; } else if(ch==='万'){ total+=(section+num||1)*10000; section=0; num=0; found=true; } } total+=section+num; return found?total:0;
}
function parseAmount(text){
  text=text.toLowerCase().replace(/ё/g,'е');
  text=text.replace(/(\d)\s+(?=\d{3}(\D|$))/g,'$1');
  let m=text.match(/(\d+(?:[.,]\d+)?)\s*(тыс|тыщ|мың|мын|млн|миллион|лям|к|k)?\b/);
  if(lang!=='zh' && m){
    let n=parseFloat(m[1].replace(',','.'));
    if(m[2]) n*= /^(млн|миллион|лям)/.test(m[2])?1000000:1000;
    return Math.round(n);
  }
  if(lang==='ru') return parseRu(text);
  if(lang==='kk') return parseKk(text);
  return parseZh(text);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null;
if(!SR){ $('mic').disabled=true; } else {
  rec=new SR(); rec.interimResults=false;
  rec.onresult=e=>{ const text=e.results[0][0].transcript; const sum=parseAmount(text); const L=t(); if(sum>0){ addItem(sum,$('cat').value); $('hint').textContent=L.added+': '+fmtSum(sum)+' ('+L.heard+': «'+text+'»)'; } else { $('hint').textContent=L.nope+': «'+text+'». '+L.again; } };
  rec.onend=()=>{ $('mic').classList.remove('rec'); $('mic').textContent=t().voice; };
  rec.onerror=()=>{ $('hint').textContent=t().micErr; };
  $('mic').onclick=()=>{ if($('mic').classList.contains('rec')){ rec.stop(); return; } rec.lang=t().sr; $('mic').classList.add('rec'); $('mic').textContent=t().stop; rec.start(); };
}
function tick(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); $('clock').textContent=p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+', '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
tick(); setInterval(tick,1000);
applyLang();
if(!SR) $('hint').textContent=t().noSR;
</script>
